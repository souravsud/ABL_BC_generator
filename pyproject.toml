[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abl-bc-generator"
version = "1.0.0"
description = "Generate OpenFOAM boundary condition files for Atmospheric Boundary Layer (ABL) simulations"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "jinja2>=3.0,<4.0",
    "matplotlib>=3.0",
    "numpy>=1.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["abl_bc_generator*"]

[tool.setuptools.package-data]
abl_bc_generator = ["BCtemplates/*", "BCtemplates/**/*"]
